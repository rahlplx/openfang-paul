name: Deploy OpenFang to VPS

# ── Triggers ─────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider (groq / openrouter / anthropic / openai)"
        required: true
        default: "groq"
        type: choice
        options: [groq, openrouter, anthropic, openai]
      domain:
        description: "Full subdomain e.g. openfang.yourdomain.com"
        required: true
        type: string
      root_domain:
        description: "Root domain e.g. yourdomain.com"
        required: true
        type: string
      agent_name:
        description: "Agent name"
        required: false
        default: "assistant"
        type: string
      dash_port:
        description: "Dashboard internal port"
        required: false
        default: "4200"
        type: string
      mode:
        description: "install / update / diagnose / uninstall"
        required: true
        default: "install"
        type: choice
        options: [install, update, diagnose, uninstall]

# ── Required Repository Secrets ──────────────────────────────
# Set these under: Settings > Secrets and variables > Actions
#
#   VPS_HOST          178.104.62.75
#   VPS_USER          root
#   VPS_PASSWORD      your-vps-password
#   OF_API_KEY        your LLM provider API key
#   OF_TG_TOKEN       your Telegram bot token
#   OF_TG_USER_ID     your Telegram numeric user ID
#   OF_DASH_PASS      dashboard password
#   OF_HOSTINGER_KEY  Hostinger API key
#   OF_SSL_EMAIL      Let's Encrypt email

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Pre-flight checks (run in GitHub, no VPS needed)
  # ────────────────────────────────────────────────────────────
  preflight:
    name: "Pre-flight: Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: ShellCheck all scripts
        run: |
          FAILED=0
          for script in install.sh update.sh diagnose.sh uninstall.sh; do
            [[ -f "$script" ]] || continue
            echo ">> ShellCheck: $script"
            shellcheck -S warning -e SC1091 "$script" || FAILED=1
          done
          exit $FAILED

      - name: Bash syntax check
        run: |
          for script in install.sh update.sh diagnose.sh uninstall.sh; do
            [[ -f "$script" ]] || continue
            echo ">> Syntax: $script"
            bash -n "$script" && echo "   OK"
          done

      - name: Validate required secrets are set
        run: |
          MISSING=0
          for secret in "VPS_HOST" "VPS_USER" "VPS_PASSWORD" "OF_API_KEY" \
                        "OF_TG_TOKEN" "OF_TG_USER_ID" "OF_DASH_PASS" \
                        "OF_HOSTINGER_KEY" "OF_SSL_EMAIL"; do
            # Secrets are masked; we can only check if the env var is non-empty
            val="${!secret:-}"
            if [[ -z "$val" ]]; then
              echo "ERROR: Secret $secret is not set"
              MISSING=1
            else
              echo "OK: $secret is set"
            fi
          done
          exit $MISSING
        env:
          VPS_HOST:         ${{ secrets.VPS_HOST }}
          VPS_USER:         ${{ secrets.VPS_USER }}
          VPS_PASSWORD:     ${{ secrets.VPS_PASSWORD }}
          OF_API_KEY:       ${{ secrets.OF_API_KEY }}
          OF_TG_TOKEN:      ${{ secrets.OF_TG_TOKEN }}
          OF_TG_USER_ID:    ${{ secrets.OF_TG_USER_ID }}
          OF_DASH_PASS:     ${{ secrets.OF_DASH_PASS }}
          OF_HOSTINGER_KEY: ${{ secrets.OF_HOSTINGER_KEY }}
          OF_SSL_EMAIL:     ${{ secrets.OF_SSL_EMAIL }}

  # ────────────────────────────────────────────────────────────
  # JOB 2: Deploy / Run chosen mode on VPS
  # ────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy: ${{ github.event.inputs.mode }} on VPS"
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Upload scripts to VPS
        run: |
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          SCP_CMD="sshpass -e scp $SSH_OPTS"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          echo ">> Uploading scripts..."
          $SCP_CMD install.sh update.sh diagnose.sh uninstall.sh \
            "$TARGET:/root/"

          echo ">> Setting executable permissions..."
          sshpass -e ssh $SSH_OPTS "$TARGET" \
            "chmod +x /root/install.sh /root/update.sh /root/diagnose.sh /root/uninstall.sh"

          echo ">> Scripts uploaded."

      - name: "[install] Run OpenFang installer"
        if: github.event.inputs.mode == 'install'
        run: |
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          sshpass -e ssh $SSH_OPTS "$TARGET" bash << 'REMOTE'
            set -euo pipefail
            export OPENFANG_NONINTERACTIVE=1
            export OF_PROVIDER="${OF_PROVIDER}"
            export OF_API_KEY="${OF_API_KEY}"
            export OF_TG_TOKEN="${OF_TG_TOKEN}"
            export OF_TG_USER_ID="${OF_TG_USER_ID}"
            export OF_DASH_USER="${OF_DASH_USER:-admin}"
            export OF_DASH_PASS="${OF_DASH_PASS}"
            export OF_DASH_PORT="${OF_DASH_PORT:-4200}"
            export OF_DOMAIN="${OF_DOMAIN}"
            export OF_HOSTINGER_KEY="${OF_HOSTINGER_KEY}"
            export OF_ROOT_DOMAIN="${OF_ROOT_DOMAIN}"
            export OF_SSL_EMAIL="${OF_SSL_EMAIL}"
            export OF_AGENT_NAME="${OF_AGENT_NAME:-assistant}"
            bash /root/install.sh
REMOTE
        env:
          OF_PROVIDER:      ${{ github.event.inputs.provider }}
          OF_API_KEY:       ${{ secrets.OF_API_KEY }}
          OF_TG_TOKEN:      ${{ secrets.OF_TG_TOKEN }}
          OF_TG_USER_ID:    ${{ secrets.OF_TG_USER_ID }}
          OF_DASH_USER:     admin
          OF_DASH_PASS:     ${{ secrets.OF_DASH_PASS }}
          OF_DASH_PORT:     ${{ github.event.inputs.dash_port }}
          OF_DOMAIN:        ${{ github.event.inputs.domain }}
          OF_HOSTINGER_KEY: ${{ secrets.OF_HOSTINGER_KEY }}
          OF_ROOT_DOMAIN:   ${{ github.event.inputs.root_domain }}
          OF_SSL_EMAIL:     ${{ secrets.OF_SSL_EMAIL }}
          OF_AGENT_NAME:    ${{ github.event.inputs.agent_name }}

      - name: "[update] Update OpenFang binary"
        if: github.event.inputs.mode == 'update'
        run: |
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          sshpass -e ssh $SSH_OPTS "$TARGET" "bash /root/update.sh"

      - name: "[diagnose] Run diagnostics"
        if: github.event.inputs.mode == 'diagnose'
        run: |
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          sshpass -e ssh $SSH_OPTS "$TARGET" "bash /root/diagnose.sh"

      - name: "[uninstall] Remove OpenFang"
        if: github.event.inputs.mode == 'uninstall'
        run: |
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          # Pass YES automatically for non-interactive uninstall
          sshpass -e ssh $SSH_OPTS "$TARGET" \
            "echo YES | bash /root/uninstall.sh"

  # ────────────────────────────────────────────────────────────
  # JOB 3: Post-deploy health check (install mode only)
  # ────────────────────────────────────────────────────────────
  healthcheck:
    name: "Post-deploy: Health Check"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.inputs.mode == 'install' || github.event.inputs.mode == 'update'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Run diagnose.sh on VPS
        run: |
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          sshpass -e ssh $SSH_OPTS "$TARGET" "bash /root/diagnose.sh"

      - name: Check HTTPS endpoint (if domain set)
        if: github.event.inputs.domain != ''
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          echo ">> Checking https://$DOMAIN ..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 --retry 3 --retry-delay 5 \
            "https://$DOMAIN" 2>/dev/null || echo "000")
          echo ">> HTTP status: $HTTP"
          if [[ "$HTTP" =~ ^(200|301|302|401|403)$ ]]; then
            echo "PASS: Site responding on HTTPS"
          else
            echo "WARN: HTTP $HTTP — SSL may still be provisioning"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo " OpenFang Deploy Summary"
          echo "=============================================="
          echo "  Mode      : ${{ github.event.inputs.mode }}"
          echo "  VPS       : ${{ secrets.VPS_HOST }}"
          echo "  Domain    : ${{ github.event.inputs.domain }}"
          echo "  Provider  : ${{ github.event.inputs.provider }}"
          echo "  Triggered : ${{ github.actor }}"
          echo "  Run ID    : ${{ github.run_id }}"
          echo "=============================================="
